<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Primer Programa JavaScript</title>
</head>
<body>
  <h1>Mi primer script de JavaScript</h1>
  <p>Abrí la consola del navegador (F12) para ver los mensajes.</p>

  <script>
    // Mi primer programa en JavaScript
    console.log("¡Hola Mundo desde la consola!");

    // Variables
    let nombre = "Agustina";
    const edad = 18;
    var ciudad = "Buenos Aires";

    // Mostrar variables individuales
    console.log("Nombre:", nombre);
    console.log("Edad:", edad);
    console.log("Ciudad:", ciudad);

    // Concatenación tradicional
    console.log("Hola " + nombre + ", tienes " + edad + " años.");

    // Template literals (ES6)
    console.log(`Hola ${nombre}, tienes ${edad} años y vives en ${ciudad}.`);

    // ===== MEJORAS (opcionales) =====

    // Más tipos de datos
    const esEstudiante = true;                                      
    const materias = ["Programación", "Redes", "Bases de datos"];
    const persona = { nombre: nombre, edad: edad, ciudad: ciudad };
    console.log("¿Es estudiante?", esEstudiante);
    console.log("Materias:", materias);
    console.log("Persona:", persona);

    // console.table con varias personas
    const personas = [
      { nombre: "Ana",   edad: 22, ciudad: "Buenos Aires" },
      { nombre: "Luis",  edad: 30, ciudad: "Rosario" },
      { nombre: "Sofía", edad: 27, ciudad: "Córdoba" }
    ];
    console.table(personas);
  </script>
</body>
</html>
